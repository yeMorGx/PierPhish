services:
  campaign-page-test-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: piersec-campaign-page-test-tunnel
    user: "0:0"
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://campaign-engine:80
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - campaign_private

networks:
  campaign_private:
    external: true
    name: piersec_campaign_private
